
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Диетолог в кармане</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background"></div>
  <div class="container">
    <h1 id="greeting">Загрузка...</h1>
    <select id="language" onchange="setLang(this.value)">
      <option value="ru">Русский</option>
      <option value="uk">Українська</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="hy">Հայերեն</option>
    </select>
    <div class="buttons">
      <button onclick="scanProduct()" id="scanBtn">📷</button>
      <button onclick="openCart()" id="cartBtn">🛒</button>
      <button onclick="showRecipes()" id="recipeBtn">📖</button>
      <button onclick="analyzeAI()" id="aiBtn">🧠</button>
      <button onclick="openRegister()" id="regBtn">👤</button>
    </div>
    <div id="content"></div>
    <video id="video" autoplay hidden></video>
  </div>
  <script src="lang.js"></script>
  <script src="logic.js"></script>
</body>
</html>
