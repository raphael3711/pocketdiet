
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Диетолог в кармане</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1 id="greeting">Загрузка...</h1>
  <select id="langSelect" onchange="changeLang(this.value)">
    <option value="ru">Русский</option>
    <option value="ua">Українська</option>
    <option value="en">English</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="zh">中文</option>
    <option value="hy">Հայերեն</option>
  </select>
  <div class="buttons">
    <button onclick="startScan()" id="scanBtn">📷</button>
    <button onclick="openCart()" id="cartBtn">🛒</button>
    <button onclick="showRecipes()" id="recipesBtn">📖</button>
    <button onclick="runAIAnalysis()" id="aiBtn">🧠</button>
    <button onclick="registerUser()" id="registerBtn">👤</button>
  </div>
  <video id="camera" autoplay hidden></video>
  <div id="output"></div>
  <script src="lang.js"></script>
  <script src="app.js"></script>
</body>
</html>
