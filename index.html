
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диетолог в кармане</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Привет! Это MVP <br>«Диетолог в кармане»</h1>
    <select id="language" onchange="changeLanguage()">
        <option value="ru">Русский</option>
        <option value="en">English</option>
        <option value="uk">Українська</option>
        <option value="hy">Հայերեն</option>
        <option value="de">Deutsch</option>
        <option value="zh">中文</option>
        <option value="fr">Français</option>
    </select>
    <div class="buttons">
        <button onclick="scan()">📷 Сканировать продукт</button>
        <button>🛒 Корзина</button>
        <button>🍲 Рецепты</button>
        <button>🧠 AI-Анализ</button>
        <button>🧾 Регистрация</button>
    </div>
    <img src="3d_sample.jpg" alt="3D визуализация" style="max-width: 100%; border-radius: 20px; box-shadow: 0 0 15px #ccc; margin-top: 20px;">
    <script src="app.js"></script>
</body>
</html>
