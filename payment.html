
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление подписки</title>
    <style>
        body { font-family: sans-serif; background: #f2f2f2; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; max-width: 400px; margin: auto; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; }
        button { background: #6772e5; color: white; padding: 12px 24px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #5469d4; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Подписка «Диетолог в кармане»</h2>
        <p>7 дней бесплатно, затем $9.99 / мес. Можно отменить в любой момент.</p>
        <button id="checkout-button">Перейти к оплате</button>
        <p style="font-size: 0.8em; color: gray;">Stripe тестовый режим. Используйте карту <b>4242 4242 4242 4242</b></p>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const stripe = Stripe("pk_test_xxx_replace_with_real_key");
        const checkoutButton = document.getElementById("checkout-button");

        checkoutButton.addEventListener("click", function () {
            fetch("https://your-server.com/create-checkout-session", {
                method: "POST",
            })
            .then(function (response) {
                return response.json();
            })
            .then(function (session) {
                return stripe.redirectToCheckout({ sessionId: session.id });
            })
            .then(function (result) {
                if (result.error) {
                    alert(result.error.message);
                }
            })
            .catch(function (error) {
                console.error("Ошибка:", error);
            });
        });
    </script>
</body>
</html>
